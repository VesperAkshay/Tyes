name: Build Android APK

on:
  push:
    branches:
      - chore/tyexhare-security-hardening
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Dependencies
        run: pnpm install
        working-directory: ./apps/tyexhare

      - name: Initialize Tauri Android
        run: pnpm tauri android init
        working-directory: ./apps/tyexhare

      - name: Build Android APK
        run: pnpm tauri android build --apk
        working-directory: ./apps/tyexhare
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyexhare-android-apk
          path: apps/tyexhare/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
